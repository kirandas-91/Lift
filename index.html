<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1013">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Lift</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--tx:#14171c;--mut:#6b7280;--ac:#1f6fe5;--ln:#d9dde3;--in:#eceff3;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#171a20;--tx:#eef0f4;--mut:#8b93a1;--ac:#4c8dff;--ln:#2a2f39;--in:#20242c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
#app{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(92px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 14px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.card{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card span,.mut{color:var(--mut);font-size:13px}
.tap:active{opacity:.55}
.seg{display:flex;background:var(--in);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:600;color:var(--mut)}
.seg .on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px #0003}
.pri{display:block;width:100%;background:var(--ac);color:#fff;border-radius:12px;padding:14px;font-weight:700;margin:14px 0 8px}
.ghost{display:block;width:100%;border:1.5px dashed var(--ln);border-radius:12px;padding:12px;color:var(--ac);font-weight:600;margin:6px 0}
.row{display:flex;align-items:center;gap:8px}
.ic{width:34px;height:34px;border-radius:10px;background:var(--in);display:grid;place-items:center;font-size:15px;flex:none;text-decoration:none;color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:3}
nav button{flex:1;padding:6px;font-size:12px;color:var(--mut);line-height:1.3}
nav .on{color:var(--ac);font-weight:700}
input[data-k]{font:inherit;color:inherit;background:var(--in);border:0;border-radius:10px;padding:10px;width:100%;text-align:center}
.set{display:grid;grid-template-columns:26px 1fr 1fr 30px;gap:8px;align-items:center;margin:6px 0}
.bd{position:fixed;inset:0;background:#0009;z-index:5}
.sh{position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));z-index:6}
.sh h2{margin:0 0 8px;font-size:19px}
.ch{width:100%;height:auto;margin:6px 0;color:var(--tx)}
</style></head>
<body>
<div id="app"></div>
<nav id="tabs">
<button data-a="tab" data-v="train">🏋️<br>Train</button>
<button data-a="tab" data-v="lib">📚<br>All Workouts</button>
<button data-a="tab" data-v="bk">💾<br>Backup</button>
</nav>
<input type="file" id="f" accept=".json,application/json" hidden>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const url=u=>{u=(u||'').trim();return u&&!/^https?:\/\//i.test(u)?'https://'+u:u};

/* ---------- storage (IndexedDB, on this phone only) ---------- */
const db=new Promise((res,rej)=>{const r=indexedDB.open('lift',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvGet=async k=>{const d=await db;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
const kvSet=async(k,v)=>{const d=await db;return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=r})};
const save=()=>kvSet('state',S);

/* ---------- starter data (all editable) ---------- */
const SEED={Chest:['Bench Press','Incline Dumbbell Press','Cable Fly'],Triceps:['Triceps Pushdown','Overhead Extension','Skull Crusher'],Shoulders:['Overhead Press','Lateral Raise','Rear Delt Fly'],'Abs/Core':['Cable Crunch','Hanging Leg Raise','Plank'],Biceps:['Barbell Curl','Hammer Curl','Incline Dumbbell Curl'],Back:['Lat Pulldown','Barbell Row','Seated Cable Row'],Legs:['Squat','Leg Press','Romanian Deadlift','Leg Curl','Calf Raise']};
function fresh(){const ex=[];for(const m in SEED)SEED[m].forEach(n=>ex.push({id:uid(),name:n,muscle:m,video:''}));
 const fl=()=>['Push - Chest & Triceps','Push - Shoulders & Abs','Pull - Biceps & Back','Legs'].map(n=>({id:uid(),name:n,ex:[]}));
 return{muscles:Object.keys(SEED),ex,plan:{H1:fl(),H2:fl()},logs:[],lastBackup:null}}

let S,V={tab:'train',half:'H1',folder:null,workout:null,sheet:null,open:{}};
const ex=id=>S.ex.find(e=>e.id==id);
const fol=()=>S.plan[V.half].find(f=>f.id==V.folder);
const hist=id=>S.logs.filter(l=>l.entries.some(e=>e.exId==id)).map(l=>({d:l.date,sets:l.entries.find(e=>e.exId==id).sets}));
const fmt=s=>s.map(t=>`${t.kg||0}×${t.reps||0}`).join(', ');
const dt=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const vid=x=>/^https?:\/\//i.test(x.video||'')?`<a class="ic" href="${esc(x.video)}" target="_blank" rel="noopener" aria-label="Form video">▶</a>`:'';

/* ---------- views ---------- */
function vTrain(){return `<h1>Train</h1><div class="seg">${['H1','H2'].map(h=>`<button class="${h==V.half?'on':''}" data-a="half" data-v="${h}">${h=='H1'?'Phase 1 (H1)':'Phase 2 (H2)'}</button>`).join('')}</div>`+
 S.plan[V.half].map(f=>`<div class="card tap" data-a="open" data-v="${f.id}"><b>${esc(f.name)}</b><span>${f.ex.length} exercises ›</span></div>`).join('')+
 `<button class="ghost" data-a="addfolder">+ Add folder to ${V.half}</button>`}

function vFolder(){const f=fol();
 return `<div class="row"><button class="ic" data-a="back">‹</button><h1 style="margin:0;flex:1;font-size:22px">${esc(f.name)}</h1><button class="ic" data-a="renf">✎</button><button class="ic" data-a="delf">🗑</button></div><p class="mut">${V.half=='H1'?'Phase 1':'Phase 2'}</p>`+
 (f.ex.length?'':'<p class="mut">No exercises yet. Add some from All Workouts.</p>')+
 f.ex.map((id,i)=>{const x=ex(id);if(!x)return'';const h=hist(id),l=h[h.length-1];
  return `<div class="card"><div style="flex:1;min-width:0"><b>${esc(x.name)}</b><br><span>${esc(x.muscle)}${l?' · Last '+esc(fmt(l.sets)):''}</span></div>${vid(x)}<button class="ic" data-a="chart" data-v="${id}">📈</button><button class="ic" data-a="up" data-v="${i}">↑</button><button class="ic" data-a="rmex" data-v="${id}">✕</button></div>`}).join('')+
 `<button class="ghost" data-a="pick">+ Add from All Workouts</button>`+(f.ex.length?`<button class="pri" data-a="start">Start workout</button>`:'')}

function vLib(){return `<h1>All Workouts</h1>`+S.muscles.map(m=>{const l=S.ex.filter(x=>x.muscle==m),o=V.open[m];
 return `<div class="card tap" data-a="mus" data-v="${esc(m)}"><b>${esc(m)}</b><span>${l.length} ${o?'▾':'▸'}</span></div>`+(o?l.map(x=>`<div class="card" style="margin-left:14px"><b style="flex:1;min-width:0">${esc(x.name)}</b>${vid(x)}<button class="ic" data-a="addto" data-v="${x.id}">＋</button><button class="ic" data-a="edx" data-v="${x.id}">✎</button><button class="ic" data-a="dlx" data-v="${x.id}">🗑</button></div>`).join('')+`<button class="ghost" data-a="newex" data-v="${esc(m)}">+ New ${esc(m)} exercise</button>`:'')}).join('')+`<button class="ghost" data-a="newm">+ New muscle group</button>`}

function vWork(){const w=V.workout;
 return `<div class="row"><button class="ic" data-a="cancel">✕</button><h1 style="margin:0;flex:1;font-size:22px">${esc(w.name)}</h1></div><p class="mut">${w.half=='H1'?'Phase 1':'Phase 2'} · weights in kg</p>`+
 w.entries.map((e,i)=>{const x=ex(e.exId),h=hist(e.exId),l=h[h.length-1];
  return `<div class="card" style="display:block"><div class="row"><b style="flex:1">${esc(x.name)}</b>${vid(x)}<button class="ic" data-a="chart" data-v="${e.exId}">📈</button></div><div class="mut">${l?'Last ('+dt(l.d)+'): '+esc(fmt(l.sets)):'First time, no history yet'}</div><div class="set mut"><span>Set</span><span>kg</span><span>Reps</span><span></span></div>`+
  e.sets.map((s,j)=>`<div class="set"><span class="mut">${j+1}</span><input inputmode="decimal" data-i="${i}" data-j="${j}" data-k="kg" value="${esc(s.kg)}" placeholder="0"><input inputmode="numeric" data-i="${i}" data-j="${j}" data-k="reps" value="${esc(s.reps)}" placeholder="0"><button class="mut" data-a="rmset" data-v="${i}|${j}">✕</button></div>`).join('')+
  `<button class="ghost" data-a="addset" data-v="${i}">+ Add set</button></div>`}).join('')+`<button class="pri" data-a="finish">Finish and save</button>`}

function vBk(){return `<h1>Backup</h1><div class="card" style="display:block"><b>${S.logs.length} workouts logged</b><div class="mut">Last backup: ${S.lastBackup?dt(S.lastBackup):'never'}</div></div><button class="pri" data-a="exp">Export backup</button><p class="mut">Opens the share sheet. Choose Save to Files, then iCloud Drive.</p><button class="ghost" data-a="imp">Restore from backup file</button>`}

function chart(id){const h=hist(id);if(!h.length)return'<p class="mut">No sessions logged yet.</p>';
 const w=300,ht=110,p=16,ys=h.map(s=>Math.max(...s.sets.map(t=>+t.kg||0))),mn=Math.min(...ys),mx=Math.max(...ys),r=(mx-mn)||1;
 const pt=ys.map((y,i)=>[p+(h.length>1?i*(w-2*p)/(h.length-1):(w-2*p)/2),ht-p-(y-mn)/r*(ht-2*p)]);
 let best={kg:0,reps:0};h.forEach(s=>s.sets.forEach(t=>{if(t.kg>best.kg||(t.kg==best.kg&&t.reps>best.reps))best=t}));
 return `<p class="mut" style="margin:0">Top set per session (kg) · PR ${best.kg} kg × ${best.reps}</p><svg viewBox="0 0 ${w} ${ht}" class="ch"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${pt.map(q=>q.join(',')).join(' ')}"/>${pt.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(--ac)"/><text x="${q[0]}" y="${q[1]-7}" text-anchor="middle" font-size="9" fill="currentColor">${ys[i]}</text>`).join('')}</svg>`+
 h.slice(-8).reverse().map(s=>`<div class="card"><b>${dt(s.d)}</b><span>${esc(fmt(s.sets))}</span></div>`).join('')}

function vSheet(){const s=V.sheet,done=`<button class="pri" data-a="close">Done</button>`;let b='';
 const lab=t=>`<div class="mut" style="margin:12px 0 4px">${esc(t)}</div>`;
 if(s.t=='pick'){const f=fol();b=`<h2>Add to ${esc(f.name)}</h2>`+S.muscles.map(m=>{const l=S.ex.filter(x=>x.muscle==m);return l.length?lab(m)+l.map(x=>`<div class="card tap" data-a="tgl" data-v="${x.id}"><b>${esc(x.name)}</b><span>${f.ex.includes(x.id)?'✓ Added':'+ Add'}</span></div>`).join(''):''}).join('')+done}
 if(s.t=='addto'){const x=ex(s.id);b=`<h2>Add ${esc(x.name)} to</h2>`+['H1','H2'].map(h=>lab(h=='H1'?'Phase 1 (H1)':'Phase 2 (H2)')+S.plan[h].map(f=>`<div class="card tap" data-a="tglp" data-v="${h}|${f.id}"><b>${esc(f.name)}</b><span>${f.ex.includes(x.id)?'✓ Added':'+ Add'}</span></div>`).join('')).join('')+done}
 if(s.t=='chart'){b=`<h2>${esc(ex(s.id).name)}</h2>`+chart(s.id)+done}
 return `<div class="bd" data-a="close"></div><div class="sh">${b}</div>`}

function render(){
 const h=V.workout?vWork():V.tab=='train'?(V.folder?vFolder():vTrain()):V.tab=='lib'?vLib():vBk();
 $('#app').innerHTML=h+(V.sheet?vSheet():'');
 $('#tabs').style.display=V.workout?'none':'flex';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==V.tab))}

/* ---------- actions ---------- */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
 switch(a){
 case'tab':V.tab=v;V.folder=null;V.sheet=null;break;
 case'half':V.half=v;break;
 case'open':V.folder=v;break;
 case'back':V.folder=null;break;
 case'addfolder':{const n=prompt('Folder name (e.g. Pull, Legs)');if(n&&n.trim())S.plan[V.half].push({id:uid(),name:n.trim(),ex:[]});break}
 case'renf':{const f=fol(),n=prompt('Rename folder',f.name);if(n&&n.trim())f.name=n.trim();break}
 case'delf':if(confirm('Delete this folder? Logged history is kept.')){S.plan[V.half]=S.plan[V.half].filter(f=>f.id!=V.folder);V.folder=null}break;
 case'pick':V.sheet={t:'pick'};break;
 case'close':V.sheet=null;break;
 case'tgl':{const f=fol(),i=f.ex.indexOf(v);i<0?f.ex.push(v):f.ex.splice(i,1);break}
 case'tglp':{const[h,fid]=v.split('|'),f=S.plan[h].find(x=>x.id==fid),i=f.ex.indexOf(V.sheet.id);i<0?f.ex.push(V.sheet.id):f.ex.splice(i,1);break}
 case'rmex':{const f=fol();f.ex=f.ex.filter(x=>x!=v);break}
 case'up':{const f=fol(),i=+v;if(i>0){[f.ex[i-1],f.ex[i]]=[f.ex[i],f.ex[i-1]]}break}
 case'chart':V.sheet={t:'chart',id:v};break;
 case'mus':V.open[v]=!V.open[v];break;
 case'addto':V.sheet={t:'addto',id:v};break;
 case'newex':{const n=prompt('Exercise name');if(!n||!n.trim())break;S.ex.push({id:uid(),name:n.trim(),muscle:v,video:url(prompt('Form video link (Instagram or YouTube), optional'))});break}
 case'edx':{const x=ex(v),n=prompt('Exercise name',x.name);if(n&&n.trim())x.name=n.trim();const u=prompt('Form video link (leave empty to remove)',x.video);if(u!==null)x.video=url(u);break}
 case'dlx':if(confirm('Delete this exercise from All Workouts and all folders? Logged history stays in backups only.')){S.ex=S.ex.filter(x=>x.id!=v);for(const h in S.plan)S.plan[h].forEach(f=>f.ex=f.ex.filter(i=>i!=v))}break;
 case'newm':{const n=prompt('Muscle group name');if(n&&n.trim()&&!S.muscles.includes(n.trim())){S.muscles.push(n.trim());V.open[n.trim()]=true}break}
 case'start':{const f=fol();V.workout={half:V.half,name:f.name,entries:f.ex.filter(i=>ex(i)).map(id=>{const h=hist(id),l=h[h.length-1];return{exId:id,sets:l?l.sets.map(s=>({kg:s.kg,reps:s.reps})):[{kg:'',reps:''}]}})};break}
 case'addset':{const s=V.workout.entries[+v].sets,l=s[s.length-1];s.push(l?{kg:l.kg,reps:l.reps}:{kg:'',reps:''});break}
 case'rmset':{const[i,j]=v.split('|').map(Number);V.workout.entries[i].sets.splice(j,1);break}
 case'cancel':if(confirm('Discard this workout?'))V.workout=null;break;
 case'finish':{const en=V.workout.entries.map(x=>({exId:x.exId,sets:x.sets.filter(s=>+s.kg>0||+s.reps>0).map(s=>({kg:+s.kg||0,reps:+s.reps||0}))})).filter(x=>x.sets.length);
  if(!en.length){alert('Log at least one set first.');break}
  S.logs.push({id:uid(),date:Date.now(),half:V.workout.half,folder:V.workout.name,entries:en});V.workout=null;break}
 case'exp':{const name=`lift-backup-${new Date().toISOString().slice(0,10)}.json`,file=new File([JSON.stringify(S)],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});
   else{const u=URL.createObjectURL(file),l=document.createElement('a');l.href=u;l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
   S.lastBackup=Date.now()}catch(err){if(err.name!='AbortError')alert('Export failed: '+err.message)}break}
 case'imp':$('#f').click();return;
 }
 await save();render()});

document.addEventListener('input',e=>{const t=e.target.dataset;if(t.k&&V.workout)V.workout.entries[t.i].sets[t.j][t.k]=e.target.value});

$('#f').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
 try{const d=JSON.parse(await file.text());if(!d.ex||!d.plan||!d.logs||!d.muscles)throw 0;
  if(!confirm('Replace ALL current data with this backup?'))return;S=d;V.folder=null;V.sheet=null;await save();render()}
 catch{alert('That file is not a valid Lift backup.')}});

(async()=>{S=await kvGet('state')||fresh();await save();navigator.storage?.persist?.();render();
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
</body></html>
