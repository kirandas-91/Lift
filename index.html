<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120f26">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Lift</title>
<style>
:root{--bg:#120f26;--card:#1e1a3a;--tx:#f4f1ff;--mut:#a49fc7;--ac:#ffb48a;--ln:#4a4380;--in:#2b2350;--g:linear-gradient(135deg,#6d28d9,#c2410c);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded",system-ui,sans-serif}
#app{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(92px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 14px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.card{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card span,.mut{color:var(--mut);font-size:13px}
.tap:active{opacity:.55}
.seg{display:flex;background:var(--in);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:600;color:var(--mut)}
.seg .on{background:var(--g);color:#fff}
.pri{display:block;width:100%;background:var(--g);color:#fff;border-radius:12px;padding:14px;font-weight:700;margin:14px 0 8px}
.ghost{display:block;width:100%;border:1.5px dashed var(--ln);border-radius:12px;padding:12px;color:var(--ac);font-weight:600;margin:6px 0}
.row{display:flex;align-items:center;gap:8px}
.ic{width:34px;height:34px;border-radius:10px;background:var(--in);display:grid;place-items:center;font-size:15px;flex:none;text-decoration:none;color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:3}
nav button{flex:1;padding:6px;font-size:12px;color:var(--mut);line-height:1.3}
nav .on{color:var(--ac);font-weight:700}
input[data-k]{font:inherit;color:inherit;background:var(--in);border:0;border-radius:10px;padding:10px;width:100%;text-align:center}
.set{display:grid;grid-template-columns:34px 1fr 1fr 26px 26px;gap:8px;align-items:center;margin:6px 0}
.bd{position:fixed;inset:0;background:#0009;z-index:5}
.sh{position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));z-index:6}
.sh h2{margin:0 0 8px;font-size:19px}
.ch{width:100%;height:auto;margin:6px 0;color:var(--tx)}
.pill{background:var(--in);color:var(--ac);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px}
.hero{background:var(--g);border-radius:22px;padding:20px;margin-bottom:16px;color:#fff}
.hero small{font-weight:700;letter-spacing:.08em}.hero h2{margin:6px 0 2px;font-size:24px}
.hero button{width:100%;margin-top:16px;background:var(--bg);color:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:16px}
.bdg{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex:none}
.chip{background:#2563eb;color:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.photo{height:150px;border-radius:20px;background:linear-gradient(135deg,#2b2350,#4a2a3a);display:grid;place-items:center;color:var(--mut);overflow:hidden;margin-top:12px}
.photo img{width:100%;height:100%;object-fit:cover}
.sn{height:44px;border-radius:10px;background:var(--in);font-weight:700;color:var(--mut)}
.sn.W{color:#fbbf24}.sn.D{color:#c4b5fd}.sn.F{color:#fca5a5}
.dd{width:52px;text-align:center;background:var(--in);border-radius:14px;padding:8px 0;flex:none}.dd small{display:block;color:var(--ac);font-weight:700;font-size:12px}.dd b{font-size:22px}
.st{display:flex;gap:8px;margin:12px 0}.st .card{flex:1;display:block;text-align:center;padding:12px 6px}.st b{font-size:20px}.st span{display:block}
</style></head>
<body>
<div id="app"></div>
<nav id="tabs">
<button data-a="tab" data-v="train">🏋️<br>Train</button>
<button data-a="tab" data-v="hist">📅<br>History</button>
<button data-a="tab" data-v="lib">📚<br>All Workouts</button>
<button data-a="tab" data-v="bk">💾<br>Backup</button>
</nav>
<input type="file" id="pf" accept="image/*" hidden>
<input type="file" id="f" accept=".json,application/json" hidden>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const url=u=>{u=(u||'').trim();return u&&!/^https?:\/\//i.test(u)?'https://'+u:u};

/* ---------- storage (IndexedDB, on this phone only) ---------- */
const db=new Promise((res,rej)=>{const r=indexedDB.open('lift',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvGet=async k=>{const d=await db;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
const kvSet=async(k,v)=>{const d=await db;return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=r})};
const save=()=>kvSet('state',S);

/* ---------- starter data (all editable) ---------- */
const SEED={Chest:['Bench Press','Incline Dumbbell Press','Cable Fly'],Triceps:['Triceps Pushdown','Overhead Extension','Skull Crusher'],Shoulders:['Overhead Press','Lateral Raise','Rear Delt Fly'],'Abs/Core':['Cable Crunch','Hanging Leg Raise','Plank'],Biceps:['Barbell Curl','Hammer Curl','Incline Dumbbell Curl'],Back:['Lat Pulldown','Barbell Row','Seated Cable Row'],Legs:['Squat','Leg Press','Romanian Deadlift','Leg Curl','Calf Raise']};
function fresh(){const ex=[];for(const m in SEED)SEED[m].forEach(n=>ex.push({id:uid(),name:n,muscle:m,video:''}));
 const fl=()=>['Push - Chest & Triceps','Push - Shoulders & Abs','Pull - Biceps & Back','Legs'].map(n=>({id:uid(),name:n,ex:[]}));
 return{muscles:Object.keys(SEED),ex,plan:{H1:fl(),H2:fl()},logs:[],lastBackup:null}}

let S,V={tab:'train',half:'H1',folder:null,workout:null,sheet:null,open:{}};
const ex=id=>S.ex.find(e=>e.id==id);
const fol=()=>S.plan[V.half].find(f=>f.id==V.folder);
const hist=id=>S.logs.filter(l=>l.entries.some(e=>e.exId==id)).map(l=>({d:l.date,sets:l.entries.find(e=>e.exId==id).sets})).sort((a,b)=>a.d-b.d);
const work=s=>{const a=s.filter(t=>t.t!='W');return a.length?a:s};
const best=id=>{let m=0;hist(id).forEach(s=>work(s.sets).forEach(t=>{if(t.kg>m)m=t.kg}));return m};
const prOK=(id,s)=>{const b=best(id);return b>0&&s.t!='W'&&+s.kg>b};
const pl=(n,w)=>n+' '+w+(n==1?'':'s');
const BC=['#2563eb','#0f766e','#b45309','#be185d','#7c3aed','#0369a1'];
const fmt=s=>s.map(t=>`${t.kg||0}×${t.reps||0}${t.t?' '+t.t:''}`).join(', ');
const dt=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const vid=x=>/^https?:\/\//i.test(x.video||'')?`<a class="ic" href="${esc(x.video)}" target="_blank" rel="noopener" aria-label="Form video">▶</a>`:'';

/* ---------- views ---------- */
function vTrain(){const fs=S.plan[V.half],w0=new Date();w0.setHours(0,0,0,0);w0.setDate(w0.getDate()-((w0.getDay()+6)%7));
 const wc=S.logs.filter(l=>l.date>=w0.getTime()).length,l=[...S.logs].sort((a,b)=>b.date-a.date).find(x=>x.half==V.half),nx=fs.length?fs[(l?fs.findIndex(f=>f.name==l.folder)+1:0)%fs.length]:null;
 return `<div class="row" style="justify-content:space-between"><h1 style="margin:0">Lift</h1>${wc?`<span class="pill">🔥 ${wc} this week</span>`:''}</div><div class="seg" style="margin-top:16px">${['H1','H2'].map(h=>`<button class="${h==V.half?'on':''}" data-a="half" data-v="${h}">${h=='H1'?'Phase 1 (H1)':'Phase 2 (H2)'}</button>`).join('')}</div>`+
 (nx?`<div class="hero"><small>UP NEXT</small><h2>${esc(nx.name)}</h2><div>${pl(nx.ex.length,'exercise')}</div><button data-a="${nx.ex.length?'qstart':'open'}" data-v="${nx.id}">${nx.ex.length?'Start workout':'Add exercises'}</button></div>`:'')+
 fs.map((f,i)=>`<div class="card tap" data-a="open" data-v="${f.id}" style="justify-content:flex-start;gap:14px"><div class="bdg" style="background:${BC[i%6]}">${esc(f.name.split(/[^A-Za-z]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase())}</div><div style="flex:1;min-width:0"><b>${esc(f.name)}</b><br><span>${pl(f.ex.length,'exercise')}</span></div><span>›</span></div>`).join('')+
 `<button class="ghost" data-a="addfolder">+ Add folder to ${V.half}</button>`}

function vFolder(){const f=fol();
 return `<div class="row"><button class="ic" data-a="back">‹</button><h1 style="margin:0;flex:1;font-size:22px">${esc(f.name)}</h1><button class="ic" data-a="renf">✎</button><button class="ic" data-a="delf">🗑</button></div><p class="mut">${V.half=='H1'?'Phase 1':'Phase 2'}</p>`+
 (f.ex.length?'':'<p class="mut">No exercises yet. Add some from All Workouts.</p>')+
 f.ex.map((id,i)=>{const x=ex(id);if(!x)return'';const h=hist(id),l=h[h.length-1];
  return `<div class="card"><div class="tap" data-a="exd" data-v="${id}" style="flex:1;min-width:0"><b>${esc(x.name)}</b><br><span>${esc(x.muscle)}${l?' · Last '+esc(fmt(l.sets)):''}</span></div>${vid(x)}<button class="ic" data-a="chart" data-v="${id}">📈</button><button class="ic" data-a="up" data-v="${i}">↑</button><button class="ic" data-a="rmex" data-v="${id}">✕</button></div>`}).join('')+
 `<button class="ghost" data-a="pick">+ Add from All Workouts</button>`+(f.ex.length?`<button class="pri" data-a="start">Start workout</button>`:'')}

function vLib(){return `<h1>All Workouts</h1>`+S.muscles.map(m=>{const l=S.ex.filter(x=>x.muscle==m),o=V.open[m];
 return `<div class="card tap" data-a="mus" data-v="${esc(m)}"><b>${esc(m)}</b><span>${l.length} ${o?'▾':'▸'}</span></div>`+(o?l.map(x=>`<div class="card" style="margin-left:14px"><b class="tap" data-a="exd" data-v="${x.id}" style="flex:1;min-width:0">${esc(x.name)} ›</b>${vid(x)}<button class="ic" data-a="addto" data-v="${x.id}">＋</button><button class="ic" data-a="edx" data-v="${x.id}">✎</button><button class="ic" data-a="dlx" data-v="${x.id}">🗑</button></div>`).join('')+`<button class="ghost" data-a="newex" data-v="${esc(m)}">+ New ${esc(m)} exercise</button>`:'')}).join('')+`<button class="ghost" data-a="newm">+ New muscle group</button>`}

function vWork(){const w=V.workout;
 return `<div class="row"><button class="ic" data-a="cancel">✕</button><h1 style="margin:0;flex:1;font-size:22px">${esc(w.name)}</h1></div><p class="mut">${w.half=='H1'?'Phase 1':'Phase 2'} · kg · tap a set number: W warm-up, D drop, F failure</p>`+
 w.entries.map((e,i)=>{const x=ex(e.exId),h=hist(e.exId),l=h[h.length-1];
  return `<div class="card" style="display:block"><div class="row"><b style="flex:1">${esc(x.name)}</b>${vid(x)}<button class="ic" data-a="chart" data-v="${e.exId}">📈</button></div>${x.notes?`<div class="mut">📝 ${esc(x.notes)}</div>`:''}<div class="mut">${l?'Last ('+dt(l.d)+'): '+esc(fmt(l.sets)):'First time, no history yet'}</div><div class="set mut"><span>Set</span><span>kg</span><span>Reps</span><span></span><span></span></div>`+
  e.sets.map((s,j)=>`<div class="set"><button class="sn ${s.t||''}" data-a="stype" data-v="${i}|${j}">${s.t||j+1}</button><input inputmode="decimal" data-i="${i}" data-j="${j}" data-k="kg" value="${esc(s.kg)}" placeholder="0"><input inputmode="numeric" data-i="${i}" data-j="${j}" data-k="reps" value="${esc(s.reps)}" placeholder="0"><span class="pr">${prOK(e.exId,s)?'🏆':''}</span><button class="mut" data-a="rmset" data-v="${i}|${j}">✕</button></div>`).join('')+
  `<button class="ghost" data-a="addset" data-v="${i}">+ Add set</button></div>`}).join('')+`<button class="pri" data-a="finish">Finish and save</button>`}

function vEx(){const x=ex(V.exid),h=hist(x.id),l=h[h.length-1];let b={kg:0,reps:0};h.forEach(s=>work(s.sets).forEach(t=>{if(t.kg>b.kg||(t.kg==b.kg&&t.reps>b.reps))b=t}));
 return `<div class="row" style="justify-content:space-between"><button class="ic" data-a="exb">‹</button><button class="ic" data-a="edx" data-v="${x.id}">✎</button></div>
<div class="photo tap" data-a="photo" data-v="${x.id}">${x.img?`<img src="${x.img}" alt="">`:'<span>📷 Tap to add your photo</span>'}</div>
<div class="row"><h1 style="flex:1;margin:12px 0">${esc(x.name)}</h1><span class="chip">${esc(x.muscle)}</span></div>
${/^https?:\/\//i.test(x.video||'')?`<a class="pri" style="text-align:center;text-decoration:none" href="${esc(x.video)}" target="_blank" rel="noopener">▶ Watch form video</a>`:`<button class="ghost" data-a="edx" data-v="${x.id}">+ Add form video link</button>`}
<div class="st"><div class="card"><b>${b.kg?b.kg+' kg':'-'}</b><span>PR</span></div><div class="card"><b>${h.length}</b><span>Sessions</span></div><div class="card"><b>${l?Math.max(...work(l.sets).map(t=>t.kg)):'-'}</b><span>Last top (kg)</span></div></div>
<div class="card tap" data-a="note" data-v="${x.id}" style="display:block"><span>NOTES</span><div>${x.notes?esc(x.notes):'<span>Tap to add notes</span>'}</div></div>
<div style="margin-top:12px">${chart(x.id)}</div><button class="ghost" data-a="addto" data-v="${x.id}">+ Add to a folder</button>`}

function vHist(){const L=[...S.logs].sort((a,b)=>b.date-a.date),D=(l,o)=>new Date(l.date).toLocaleDateString(undefined,o);
 return `<h1>History</h1><p class="mut">${pl(S.logs.length,'workout')}</p>`+(L.length?L.map(l=>`<div class="card tap" data-a="hv" data-v="${l.id}" style="justify-content:flex-start;gap:14px"><div class="dd"><small>${D(l,{weekday:'short'}).toUpperCase()}</small><b>${new Date(l.date).getDate()}</b></div><div style="flex:1;min-width:0"><b>${esc(l.folder)}</b><br><span>${D(l,{month:'short',year:'numeric'})} · ${pl(l.entries.length,'exercise')} · ${pl(l.entries.reduce((a,e)=>a+e.sets.length,0),'set')} · ${l.half}</span></div><button class="ic" data-a="dlw" data-v="${l.id}">🗑</button></div>`).join(''):'<p class="mut">No workouts logged yet.</p>')}

function vBk(){return `<h1>Backup</h1><div class="card" style="display:block"><b>${pl(S.logs.length,'workout')} logged</b><div class="mut">Last backup: ${S.lastBackup?dt(S.lastBackup):'never'}</div></div><button class="pri" data-a="exp">Export backup</button><p class="mut">Opens the share sheet. Choose Save to Files, then iCloud Drive.</p><button class="ghost" data-a="imp">Restore from backup file</button>`}

function chart(id){const h=hist(id);if(!h.length)return'<p class="mut">No sessions logged yet.</p>';
 const w=300,ht=110,p=16,ys=h.map(s=>Math.max(...work(s.sets).map(t=>+t.kg||0))),mn=Math.min(...ys),mx=Math.max(...ys),r=(mx-mn)||1;
 const pt=ys.map((y,i)=>[p+(h.length>1?i*(w-2*p)/(h.length-1):(w-2*p)/2),ht-p-(y-mn)/r*(ht-2*p)]);
 let best={kg:0,reps:0};h.forEach(s=>work(s.sets).forEach(t=>{if(t.kg>best.kg||(t.kg==best.kg&&t.reps>best.reps))best=t}));
 return `<p class="mut" style="margin:0">Top set per session (kg) · PR ${best.kg} kg × ${best.reps}</p><svg viewBox="0 0 ${w} ${ht}" class="ch"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${pt.map(q=>q.join(',')).join(' ')}"/>${pt.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(--ac)"/><text x="${q[0]}" y="${q[1]-7}" text-anchor="middle" font-size="9" fill="currentColor">${ys[i]}</text>`).join('')}</svg>`+
 h.slice(-8).reverse().map(s=>`<div class="card"><b>${dt(s.d)}</b><span>${esc(fmt(s.sets))}</span></div>`).join('')}

function vSheet(){const s=V.sheet,done=`<button class="pri" data-a="close">Done</button>`;let b='';
 const lab=t=>`<div class="mut" style="margin:12px 0 4px">${esc(t)}</div>`;
 if(s.t=='pick'){const f=fol();b=`<h2>Add to ${esc(f.name)}</h2>`+S.muscles.map(m=>{const l=S.ex.filter(x=>x.muscle==m);return l.length?lab(m)+l.map(x=>`<div class="card tap" data-a="tgl" data-v="${x.id}"><b>${esc(x.name)}</b><span>${f.ex.includes(x.id)?'✓ Added':'+ Add'}</span></div>`).join(''):''}).join('')+done}
 if(s.t=='addto'){const x=ex(s.id);b=`<h2>Add ${esc(x.name)} to</h2>`+['H1','H2'].map(h=>lab(h=='H1'?'Phase 1 (H1)':'Phase 2 (H2)')+S.plan[h].map(f=>`<div class="card tap" data-a="tglp" data-v="${h}|${f.id}"><b>${esc(f.name)}</b><span>${f.ex.includes(x.id)?'✓ Added':'+ Add'}</span></div>`).join('')).join('')+done}
 if(s.t=='log'){const l=S.logs.find(x=>x.id==s.id);b=`<h2>${esc(l.folder)}</h2><p class="mut">${new Date(l.date).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>`+l.entries.map(e=>`<div class="card"><b>${esc(ex(e.exId)?.name||'Removed exercise')}</b><span>${esc(fmt(e.sets))}</span></div>`).join('')+`<button class="ghost" data-a="chd" data-v="${l.id}">Change date</button><button class="ghost" style="color:#fca5a5" data-a="dlw" data-v="${l.id}">Delete this workout</button>`+done}
 if(s.t=='chart'){b=`<h2>${esc(ex(s.id).name)}</h2>`+chart(s.id)+done}
 return `<div class="bd" data-a="close"></div><div class="sh">${b}</div>`}

function render(){
 const h=V.workout?vWork():V.exid?vEx():V.tab=='train'?(V.folder?vFolder():vTrain()):V.tab=='lib'?vLib():V.tab=='hist'?vHist():vBk();
 $('#app').innerHTML=h+(V.sheet?vSheet():'');
 $('#tabs').style.display=V.workout?'none':'flex';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==V.tab))}

/* ---------- actions ---------- */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
 switch(a){
 case'tab':V.tab=v;V.folder=null;V.exid=null;V.sheet=null;break;
 case'half':V.half=v;break;
 case'open':V.folder=v;break;
 case'back':V.folder=null;break;
 case'addfolder':{const n=prompt('Folder name (e.g. Pull, Legs)');if(n&&n.trim())S.plan[V.half].push({id:uid(),name:n.trim(),ex:[]});break}
 case'renf':{const f=fol(),n=prompt('Rename folder',f.name);if(n&&n.trim())f.name=n.trim();break}
 case'delf':if(confirm('Delete this folder? Logged history is kept.')){S.plan[V.half]=S.plan[V.half].filter(f=>f.id!=V.folder);V.folder=null}break;
 case'pick':V.sheet={t:'pick'};break;
 case'close':V.sheet=null;break;
 case'tgl':{const f=fol(),i=f.ex.indexOf(v);i<0?f.ex.push(v):f.ex.splice(i,1);break}
 case'tglp':{const[h,fid]=v.split('|'),f=S.plan[h].find(x=>x.id==fid),i=f.ex.indexOf(V.sheet.id);i<0?f.ex.push(V.sheet.id):f.ex.splice(i,1);break}
 case'rmex':{const f=fol();f.ex=f.ex.filter(x=>x!=v);break}
 case'up':{const f=fol(),i=+v;if(i>0){[f.ex[i-1],f.ex[i]]=[f.ex[i],f.ex[i-1]]}break}
 case'chart':V.sheet={t:'chart',id:v};break;
 case'mus':V.open[v]=!V.open[v];break;
 case'addto':V.sheet={t:'addto',id:v};break;
 case'newex':{const n=prompt('Exercise name');if(!n||!n.trim())break;S.ex.push({id:uid(),name:n.trim(),muscle:v,video:url(prompt('Form video link (Instagram or YouTube), optional'))});break}
 case'edx':{const x=ex(v),n=prompt('Exercise name',x.name);if(n&&n.trim())x.name=n.trim();const u=prompt('Form video link (leave empty to remove)',x.video);if(u!==null)x.video=url(u);break}
 case'dlx':if(confirm('Delete this exercise from All Workouts and all folders? Logged history stays in backups only.')){S.ex=S.ex.filter(x=>x.id!=v);for(const h in S.plan)S.plan[h].forEach(f=>f.ex=f.ex.filter(i=>i!=v))}break;
 case'newm':{const n=prompt('Muscle group name');if(n&&n.trim()&&!S.muscles.includes(n.trim())){S.muscles.push(n.trim());V.open[n.trim()]=true}break}
 case'qstart':V.folder=v;case'start':{const f=fol();V.workout={half:V.half,name:f.name,entries:f.ex.filter(i=>ex(i)).map(id=>{const h=hist(id),l=h[h.length-1];return{exId:id,sets:l?l.sets.map(s=>({kg:s.kg,reps:s.reps})):[{kg:'',reps:''}]}})};break}
 case'addset':{const s=V.workout.entries[+v].sets,l=s[s.length-1];s.push(l?{kg:l.kg,reps:l.reps}:{kg:'',reps:''});break}
 case'rmset':{const[i,j]=v.split('|').map(Number);V.workout.entries[i].sets.splice(j,1);break}
 case'cancel':if(confirm('Discard this workout?'))V.workout=null;break;
 case'finish':{const en=V.workout.entries.map(x=>({exId:x.exId,sets:x.sets.filter(s=>+s.kg>0||+s.reps>0).map(s=>({kg:+s.kg||0,reps:+s.reps||0,t:s.t||''}))})).filter(x=>x.sets.length);
  let prs=0;en.forEach(x=>{const b=best(x.exId);if(b>0&&work(x.sets).some(s=>s.kg>b))prs++});
  if(!en.length){alert('Log at least one set first.');break}
  S.logs.push({id:uid(),date:Date.now(),half:V.workout.half,folder:V.workout.name,entries:en});V.workout=null;if(prs)setTimeout(()=>alert('🏆 '+prs+' new PR'+(prs>1?'s':'')+'!'),50);break}
 case'exp':{const name=`lift-backup-${new Date().toISOString().slice(0,10)}.json`,file=new File([JSON.stringify(S)],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});
   else{const u=URL.createObjectURL(file),l=document.createElement('a');l.href=u;l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
   S.lastBackup=Date.now()}catch(err){if(err.name!='AbortError')alert('Export failed: '+err.message)}break}
 case'exd':V.exid=v;V.sheet=null;break;
 case'exb':V.exid=null;break;
 case'photo':V.pid=v;$('#pf').click();return;
 case'note':{const x=ex(v),n=prompt('Notes / form cues',x.notes||'');if(n!==null)x.notes=n.trim();break}
 case'stype':{const[i,j]=v.split('|').map(Number),s=V.workout.entries[i].sets[j],o=['','W','D','F'];s.t=o[(o.indexOf(s.t||'')+1)%4];break}
 case'hv':V.sheet={t:'log',id:v};break;
 case'dlw':if(confirm('Delete this workout from history?')){S.logs=S.logs.filter(l=>l.id!=v);V.sheet=null}break;
 case'chd':{const l=S.logs.find(x=>x.id==v),d=new Date(l.date),iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),n=prompt('New date (YYYY-MM-DD)',iso);if(n){const q=new Date(n+'T12:00:00');if(isNaN(q))alert('Please use the format YYYY-MM-DD');else l.date=q.getTime()}break}
 case'imp':$('#f').click();return;
 }
 await save();render()});

document.addEventListener('input',e=>{const t=e.target.dataset;if(t.k&&V.workout){const en=V.workout.entries[t.i],s=en.sets[t.j];s[t.k]=e.target.value;const p=e.target.closest('.set').querySelector('.pr');if(p)p.textContent=prOK(en.exId,s)?'🏆':''}});

$('#f').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
 try{const d=JSON.parse(await file.text());if(!d.ex||!d.plan||!d.logs||!d.muscles)throw 0;
  if(!confirm('Replace ALL current data with this backup?'))return;S=d;V.folder=null;V.sheet=null;await save();render()}
 catch{alert('That file is not a valid Lift backup.')}});

$('#pf').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ex(V.pid).img=c.toDataURL('image/jpeg',.7);URL.revokeObjectURL(im.src);save();render()};im.src=URL.createObjectURL(f)});

(async()=>{S=await kvGet('state')||fresh();await save();navigator.storage?.persist?.();render();
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
</body></html>
